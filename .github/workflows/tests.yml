name: Codeception

on: [push]

jobs:

  tests:
    name: Unit Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
    - uses: actions/checkout@v4

    ############################################################################
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer:v2
        coverage: none

      #https://github.com/actions/cache/blob/master/examples.md#php---composer
    - name: Cache composer packages
      id: composer-cache
      run: |
        composer config cache-files-dir
        echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-php${{ matrix.php }}-

    - name: Update project dependencies
      run: |
        composer install --prefer-dist --no-progress
        composer dump-autoload --optimize
    ############################################################################

    - name: Run the tests
      run: ./vendor/bin/codecept run --xml

    - name: Archive unit tests results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: codeception-output-files-php${{ matrix.php }}
        path: tests/_output/
