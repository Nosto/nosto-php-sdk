name: PHP CI

on: [push]

jobs:

  phpcs:
    name: Code Sniffer
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    ############################################################################
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      env:
        update: true
      with:
        php-version: '8.2'
        tools: composer:v2
        extensions: ast
        coverage: none

      #https://github.com/actions/cache/blob/master/examples.md#php---composer
    - name: Cache composer packages
      id: composer-cache
      run: |
        composer config cache-files-dir
        echo "::set-output name=dir::$(composer config cache-files-dir)"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Update project dependencies
      run: |
        composer install --prefer-dist --no-progress
        composer dump-autoload --optimize
    ############################################################################

    - name: Run the sniffer
      run: |
        ./vendor/bin/phpcs --config-set ignore_errors_on_exit 1
        ./vendor/bin/phpcs --config-set ignore_warnings_on_exit 1
        ./vendor/bin/phpcs --standard=ruleset.xml --severity=10 --report=checkstyle --report-file=chkphpcs.xml .

    - name: Archive code sniffing results
      uses: actions/upload-artifact@v4
      with:
        name: phpcs-xml-result
        path: chkphpcs.xml

    - name: Report annotations
      id: report-annotations
      run: ./vendor/bin/cs2pr chkphpcs.xml

  phpmd:
    name: Mess Detect
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    ############################################################################
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      env:
        update: true
      with:
        php-version: '8.2'
        tools: composer:v2
        extensions: ast
        coverage: none

      #https://github.com/actions/cache/blob/master/examples.md#php---composer
    - name: Cache composer packages
      id: composer-cache
      run: |
        composer config cache-files-dir
        echo "::set-output name=dir::$(composer config cache-files-dir)"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Update project dependencies
      run: |
        composer install --prefer-dist --no-progress
        composer dump-autoload --optimize
    ############################################################################

    - name: Run the mess detector
      run: ./vendor/bin/phpmd . xml codesize,naming,unusedcode,controversial,design --exclude vendor,var,build,tests,.phan --reportfile pmdphpmd.xml --ignore-violations-on-exit

    - name: Archive mess detection results
      uses: actions/upload-artifact@v4
      with:
        name: phpmd-xml-result
        path: pmdphpmd.xml

    - name: Detect code standard violations
      if: always() && hashFiles('pmdphpmd.xml') != ''
      run: |
        php -r "
        \$xml = @simplexml_load_file('pmdphpmd.xml');
        if (\$xml === false) { exit(0); }
        \$workspace = rtrim(getenv('GITHUB_WORKSPACE') ?: '', '/');
        foreach (\$xml->file as \$file) {
          \$filepath = (string)\$file['name'];
          if (\$workspace !== '' && strpos(\$filepath, \$workspace . '/') === 0) {
            \$filepath = substr(\$filepath, strlen(\$workspace) + 1);
          }
          \$filepath = str_replace(['%', \"\r\", \"\n\"], ['%25', '%0D', '%0A'], \$filepath);
          foreach (\$file->violation as \$violation) {
            \$line = (int)\$violation['beginline'];
            \$msg = trim((string)\$violation);
            \$msg = str_replace(['%', \"\r\", \"\n\"], ['%25', '%0D', '%0A'], \$msg);
            echo \"::notice file={\$filepath},line={\$line}::PHPMD: {\$msg}\n\";
          }
        }
        " || true

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    ############################################################################
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      env:
        update: true
      with:
        php-version: '8.2'
        tools: composer:v2
        extensions: ast
        coverage: none

      #https://github.com/actions/cache/blob/master/examples.md#php---composer
    - name: Cache composer packages
      id: composer-cache
      run: |
        echo "::set-output name=dir::$(composer config cache-files-dir)"
    - uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Update project dependencies
      run: |
        composer install --prefer-dist --no-progress
        composer dump-autoload --optimize
    ############################################################################

    - name: Build archive using composer
      run: composer archive --format=zip --file=archive

    - name: Archive built package
      uses: actions/upload-artifact@v4
      with:
        name: composer-zip-archive
        path: archive.zip
