actor_suffix: Tester
bootstrap: _bootstrap.php
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
settings:
    colors: true
    memory_limit: 1024M
coverage:
    enabled: true
    remote: false
    include:
        - src/*
    exclude:
        - src/classes/NostoCurrency.php
